experiment:
  name: "AU Query Cluster Test 001"
  slug: test-001
  target_url: "https://example.com/sell-eggs-from-home"
  target_domain: "example.com"
  sessions_per_month: 300
  baseline_days: 28
  treatment_days: 28
  post_treatment_days: 21
  queries:
    - text: "sell eggs from home"
      type: core
      weight: 0.30
    - text: "selling eggs from home"
      type: close_variation
      weight: 0.20
    - text: "how to sell eggs from home"
      type: close_variation
      weight: 0.15
    - text: "sell eggs from home australia"
      type: local
      weight: 0.15
    - text: "can i sell eggs from my house"
      type: long_tail
      weight: 0.10
    - text: "rules for selling eggs from home"
      type: long_tail
      weight: 0.10

identities:
  total: 100
  desktop_percent: 65
  mobile_percent: 35

proxy:
  provider: decodo
  country: AU
  sticky_per_session: true

search:
  max_serp_pages: 3

schedule:
  allowed_start: "06:30"
  allowed_end: "23:00"
  timezone: "Australia/Adelaide"
  max_sessions_per_identity_per_day: 1
  repeat_identity_min_gap_days: 2
  min_minutes_between_global_sessions: 5

engagement:
  read_only: 0.35
  internal_navigation: 0.30
  short_visit: 0.15
  long_read: 0.20
